<!doctype html>
<!-- Whisky Notes v3.32 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Whisky Notes v3.32</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1e6d2;--panel:#fbf6ea;--line:#dcc9aa;--ink:#3b2417;--mute:#5e4a37;--brown:#7a3d1c;--amber:#e3a03a;--cream:#f7eddb;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg) var(--paper);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;font-weight:600}
h2{font-size:26px}h3{font-size:21px;margin:4px 0 10px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brown);outline-offset:2px}
.page{max-width:760px;margin:0 auto;padding:16px 16px calc(90px + env(safe-area-inset-bottom))}
.bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.bar button{flex:1;background:none;border:0;min-height:56px;color:var(--mute);font-weight:600}
.bar button.on{color:var(--brown);box-shadow:inset 0 3px var(--brown)}
.btn{background:var(--brown);color:var(--cream);border:0;border-radius:var(--r);padding:12px 18px;font-weight:600;min-height:48px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:#a2392b;border:1px solid #d9a79c}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;text-align:left}
.row small,.mute,.item small{color:var(--mute)}
.card{display:block}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tab{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;color:var(--mute);min-height:38px}
.tab.on{background:var(--brown);border-color:var(--brown);color:var(--cream)}
.item{display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:10px}
.main{display:flex;gap:12px;flex:1;min-width:0;background:none;border:0;text-align:left;align-items:center;padding:0}
.item img,.ph{width:56px;height:72px;border-radius:8px;object-fit:cover;background:var(--line);flex:none}
.item b{display:block;font-family:Fraunces,Georgia,serif}
.heart{background:none;border:0;font-size:26px;color:var(--line);min-width:44px;min-height:44px}
.heart.on{color:#c0392b}
.s{display:inline-block;position:relative;color:var(--line)}
.s.f{color:var(--amber)}
.s.h{background:linear-gradient(90deg,var(--amber) 50%,var(--line) 50%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stars{letter-spacing:1px}
.rate{display:flex;margin:8px 0}
.rate .s{font-size:40px;width:44px;height:44px;line-height:44px;text-align:center}
.rate b{position:absolute;top:0;bottom:0;width:50%;cursor:pointer}
.rate b:first-child{left:0}.rate b:last-child{right:0}
.big{font-size:30px;margin:6px 0}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.top{display:grid;grid-template-columns:150px 1fr;gap:16px;margin:12px 0}
.photo{aspect-ratio:1/2;border:1px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;text-align:center;color:var(--mute);cursor:pointer;overflow:hidden;position:relative;padding:8px}
.photo.drag{border-color:var(--brown)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-content:start}
.fld{display:block;color:var(--mute);font-size:14px;margin-bottom:10px}
.grid .fld{margin:0}
.fld input,.fld select,.fld textarea{display:block;width:100%;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;color:var(--ink)}
.fld textarea{min-height:72px;resize:vertical}
.sec{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.lock{border:0;margin:0;padding:0;min-width:0}
.lock[disabled] input,.lock[disabled] select,.lock[disabled] textarea{color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink);border-color:transparent;background:var(--panel)}
.lock[disabled] .chip input{opacity:0}
fieldset{border:0;padding:0;margin:8px 0 12px}
legend{color:var(--mute);font-size:14px;padding:0;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:9px 14px;min-height:44px;line-height:24px;cursor:pointer;user-select:none;background:var(--panel)}
.chip input:checked+span{background:var(--brown);border-color:var(--brown);color:var(--cream);font-weight:600}
.chip input:focus-visible+span{outline:2px solid var(--ink)}
.acts{display:flex;gap:12px;margin-top:22px}
.acts .btn{flex:1}
.acts.pin{position:sticky;bottom:calc(57px + env(safe-area-inset-bottom));background:var(--bg) var(--paper);border-top:1px solid var(--line);margin:14px -16px 0;padding:10px 16px;z-index:3}
.empty{color:var(--mute);padding:20px 4px}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.login{display:grid;justify-items:center;min-height:100vh;text-align:center;gap:14px;align-content:center;max-width:340px;margin:0 auto;padding:0 16px}
.login h1{font-size:40px}
.login .fld{width:100%;text-align:left}
.login .acts{width:100%}
.err{color:#a2392b;min-height:1.4em;margin:0}
.tip{position:sticky;bottom:calc(135px + env(safe-area-inset-bottom));background:var(--ink);color:var(--cream);border-radius:var(--r);padding:10px 14px;margin:10px 0;z-index:4;cursor:pointer}
.tip small{color:#d9bf9c}
.ov{position:fixed;inset:0;background:var(--bg) var(--paper);overflow:auto;z-index:8;padding-top:env(safe-area-inset-top)}
.cmp{display:grid;grid-template-columns:72px 1fr 1fr;gap:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:10px 0}.cmp>*{min-width:0;overflow-wrap:anywhere}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 10px;margin:2px 4px 2px 0;background:var(--panel);font-size:14px}.pill.sh{background:var(--brown);border-color:var(--brown);color:var(--cream)}
span.heart{display:inline-block;text-align:center;line-height:44px;pointer-events:none}
.ver{font:12px Figtree,system-ui,sans-serif;color:var(--mute)}
@media(max-width:560px){.top{grid-template-columns:110px 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Learning library v3.13 */
.learn-hub-head{margin:4px 0 18px;padding:6px 2px 0}
.eyebrow{display:block;font:600 10px/1.3 Figtree,system-ui,sans-serif;letter-spacing:1.8px;color:#8a6847}
.notebook-brand{display:flex;align-items:baseline;flex-wrap:wrap;gap:9px;margin:0 0 5px;color:#80502f;font:700 18px/1.2 Figtree,system-ui,sans-serif;letter-spacing:1.65px}
.notebook-brand small{font:600 12px/1 Figtree,system-ui,sans-serif;letter-spacing:.06em;color:#9a7956}

.learn-hub-head h2{font-size:30px;margin:5px 0 7px}
.learn-hub-head p,.learn-top>p{max-width:600px;color:var(--mute);margin:0}
.learn-grid,.flavour-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.learn-card{min-width:0;min-height:198px;position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:12px 13px 13px;background:linear-gradient(160deg,#fcf8ef,#f5ead8);border:1px solid #d7c3a3;border-radius:14px;box-shadow:0 2px 5px rgba(69,43,22,.07);color:var(--ink);overflow:hidden}
.learn-card:active,.flavour-cat-card:active{transform:translateY(1px);box-shadow:inset 0 2px 5px rgba(65,42,24,.12)}
.learn-number{position:absolute;top:10px;right:12px;font:600 10px Figtree,sans-serif;letter-spacing:1px;color:#927858}
.learn-art{width:100%;height:78px;display:flex;align-items:center;justify-content:center;margin:2px 0 8px}
.learn-art svg{width:100%;height:100%;max-width:120px;filter:drop-shadow(0 2px 1px rgba(67,42,23,.08))}
.learn-card-title{font:600 18px/1.15 Fraunces,Georgia,serif;margin:0 0 5px}
.learn-card-copy{font-size:12px;line-height:1.35;color:var(--mute);flex:1}
.learn-card-link{margin-top:10px;font-size:11px;font-weight:600;letter-spacing:.3px;color:#80502f}
.learn-card-link span{font-size:15px;margin-left:3px}
.learn-footnote{font-size:12px;line-height:1.5;color:var(--mute);margin:18px 2px 4px}
.learn-top{margin:0 0 14px}
.learn-back,.text-link{border:0;background:none;padding:6px 0;color:#80502f;font-weight:600;min-height:38px;text-align:left}
.learn-top .eyebrow{margin-top:13px}
.learn-top h2{font-size:29px;margin:4px 0 6px}
.learn-inline-actions{margin:0 0 8px}
.learn-note{background:#eee3d0;border-left:3px solid #aa865c;border-radius:0 9px 9px 0;padding:11px 13px;font-size:13px;color:#5e4a37;line-height:1.5;margin:12px 0 15px}
.flavour-cat-card{min-width:0;min-height:166px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:linear-gradient(160deg,#fcf8ef,#f6ecdd);border:1px solid var(--line);border-radius:14px;padding:11px 12px 10px;color:var(--ink);box-shadow:0 2px 5px rgba(69,43,22,.05)}
.flavour-art{height:54px;width:100%;display:flex;align-items:center;justify-content:flex-start;margin-bottom:6px}
.flavour-art svg{width:56px;height:56px}
.flavour-cat-title{font:600 17px/1.15 Fraunces,Georgia,serif;margin-bottom:4px}
.flavour-cat-copy{font-size:11px;line-height:1.35;color:var(--mute);flex:1}
.flavour-count{display:flex;justify-content:space-between;width:100%;margin-top:9px;color:#80502f;font-size:10px;font-weight:600;letter-spacing:.2px}
.flavour-count span{font-size:16px;line-height:10px}
.descriptor-list{display:flex;flex-direction:column;gap:8px}
.descriptor-card,.stage-card,.style-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.descriptor-card.expanded,.stage-card.expanded,.style-card.expanded{border-color:#bda17c;box-shadow:0 2px 8px rgba(69,43,22,.06)}
.descriptor-toggle,.stage-toggle,.style-toggle{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:12px 13px;color:var(--ink);min-height:54px}
.descriptor-toggle>span:first-child,.style-toggle>span:first-child{flex:1;min-width:0}
.descriptor-toggle b,.descriptor-toggle small,.stage-title-wrap b,.stage-title-wrap small,.style-toggle b,.style-toggle small{display:block}
.descriptor-toggle b,.style-toggle b{font:600 16px Fraunces,Georgia,serif}
.descriptor-toggle small,.style-toggle small,.stage-title-wrap small{font-size:11px;line-height:1.35;color:var(--mute);margin-top:3px}
.descriptor-plus,.stage-plus{font:400 21px/1 Figtree,sans-serif;color:#8a6847;flex:none}
.descriptor-detail,.stage-detail,.style-detail{padding:0 14px 13px;color:var(--ink);font-size:13px;line-height:1.5}
.descriptor-detail p,.stage-detail p,.style-detail p{margin:8px 0}
.descriptor-detail b,.style-detail b{color:#6f482d}
.descriptor-tip,.style-note{background:#f1e8d9;border-radius:8px;padding:8px 10px;color:var(--mute);font-size:11px}
.country-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 9px;margin:0 0 7px;scrollbar-width:thin}
.country-tab{background:none;border:1px solid var(--line);border-radius:99px;padding:7px 12px;min-height:38px;white-space:nowrap;font-size:12px;color:var(--mute)}
.country-tab.on{background:#6f482d;border-color:#6f482d;color:#fbf3e4}
.country-intro{padding:8px 1px 13px}
.country-intro h3{margin:0 0 5px}
.country-intro p{margin:0;color:var(--mute);font-size:13px;line-height:1.5}
.region-list{display:flex;flex-direction:column;gap:8px}
.region-card{display:flex;align-items:center;gap:10px;width:100%;padding:12px 13px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--ink);text-align:left}
.region-card-main{display:block;flex:1;min-width:0}
.region-card b,.region-card small,.region-card-main>span{display:block}
.region-card b{font:600 17px Fraunces,Georgia,serif}
.region-card small{font-size:10px;color:#8a6847;margin:2px 0 6px}
.region-card-main>span{font-size:12px;line-height:1.4;color:var(--mute)}
.region-chevron{font-size:23px;color:#8a6847;flex:none}
.region-detail{background:linear-gradient(160deg,#fcf8ef,#f6ecdd);border:1px solid var(--line);border-radius:14px;padding:15px}
.region-kicker{display:block;font-size:10px;letter-spacing:1px;color:#8a6847;line-height:1.45}
.region-detail h3{font-size:25px;margin:5px 0 12px}
.region-section{border-top:1px solid #e2d2b9;padding:10px 0 2px}
.region-section h4{font:600 14px Fraunces,Georgia,serif;margin:0 0 4px;color:#6f482d}
.region-section p,.region-examples p{margin:0;font-size:13px;line-height:1.5;color:var(--mute)}
.region-names{font-weight:600;color:var(--ink)!important}
.region-examples{background:#eee3d0;border-radius:9px;padding:11px 12px;margin-top:11px}
.region-examples .eyebrow{margin-bottom:5px}
.region-note{margin-top:13px}
.process-intro{display:flex;align-items:center;gap:10px;color:#8a6847;font-size:10px;font-weight:600;letter-spacing:1.5px;margin:16px 4px 10px}
.process-line{height:1px;background:#cdb99a;flex:1}
.stage-list,.style-list{display:flex;flex-direction:column;gap:9px}
.stage-toggle{padding:12px;min-height:66px}
.stage-num{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:1px solid #c9b18e;background:#f0e5d2;color:#80502f;font:600 12px Fraunces,Georgia,serif;flex:none}
.stage-title-wrap{flex:1;min-width:0}
.stage-title-wrap b{font:600 17px Fraunces,Georgia,serif}
.stage-terms{border-top:1px solid #e5d6c0;padding-top:9px;margin-top:10px;display:flex;flex-direction:column;gap:3px}
.stage-terms b{font-size:11px;color:#80502f}
.stage-terms span{font-size:11px;color:var(--mute)}
.style-toggle{min-height:60px}
.style-detail{padding-top:0}
.style-examples{background:#eee3d0;border-radius:8px;padding:9px 10px;margin:10px 0}
.style-examples .eyebrow{margin-bottom:4px}
.style-examples p{margin:0;font-size:12px;color:var(--ink)}


/* v3.14 Learn refinements: larger supporting text, fifth card and bottle reference */
.learning-view .eyebrow{font-size:11px}
.learning-view .learn-number{font-size:11px}
.learning-view .learn-card-copy{font-size:13px;line-height:1.4}
.learning-view .learn-card-link{font-size:12px}
.learning-view .learn-footnote{font-size:13px}
.learning-view .flavour-cat-copy{font-size:12px}
.learning-view .flavour-count{font-size:11px}
.learning-view .descriptor-toggle small,.learning-view .style-toggle small,.learning-view .stage-title-wrap small{font-size:12px}
.learning-view .descriptor-tip,.learning-view .style-note{font-size:12px}
.learning-view .country-tab{font-size:13px}
.learning-view .region-card small{font-size:11px}
.learning-view .region-card-main>span{font-size:13px}
.learning-view .region-kicker{font-size:11px}
.learning-view .process-intro{font-size:11px}
.learning-view .stage-terms b,.learning-view .stage-terms span{font-size:12px}

/* v3.15: slightly larger smallest supporting text in Learn */
.learning-view .eyebrow,
.learning-view .learn-number,
.learning-view .flavour-count,
.learning-view .region-kicker,
.learning-view .process-intro{
  font-size:12px;
}
.learn-card-water{grid-column:1/-1;min-height:108px;height:108px;display:grid;grid-template-columns:66px minmax(0,1fr) auto;grid-template-rows:auto auto;align-items:center;column-gap:12px;padding:12px 14px}
.learn-card-water .learn-art{grid-column:1;grid-row:1/3;width:66px;height:66px;margin:0}
.learn-card-water .learn-art svg{max-width:66px}
.learn-card-water .learn-card-title{grid-column:2;grid-row:1;align-self:end;margin:0 0 3px}
.learn-card-water .learn-card-copy{grid-column:2;grid-row:2;align-self:start;min-width:0}
.learn-card-water .learn-card-link{grid-column:3;grid-row:1/3;align-self:center;margin:0;white-space:nowrap}
.learn-card-water .learn-number{top:7px;right:9px;opacity:.8}
.water-placeholder{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:20px;padding:24px 18px;background:linear-gradient(160deg,#fcf8ef,#f6ecdd);border:1px solid var(--line);border-radius:14px}
.water-placeholder-art{display:block;width:110px;height:90px;margin-bottom:10px}
.water-placeholder-art svg{width:100%;height:100%}
.water-placeholder h3{margin:0 0 7px}
.water-placeholder p{max-width:420px;margin:0;color:var(--mute);font-size:14px;line-height:1.5}
@media(max-width:360px){.learn-card-water{grid-template-columns:54px minmax(0,1fr) auto;column-gap:8px;padding:10px}.learn-card-water .learn-art{width:54px;height:58px}.learn-card-water .learn-art svg{max-width:54px}.learn-card-water .learn-card-title{font-size:16px}.learn-card-water .learn-card-link{font-size:12px}}



/* v3.16 — Stage 2: Tastings, New Tasting and Compare visual refresh */
/* v3.19 — remove duplicate water amount preview */
.section-page-head,.tasting-page-head{margin:4px 0 17px;padding:6px 2px 0}
.section-page-head h2,.tasting-page-head h2{font-size:30px;margin:5px 0 6px}
.section-page-head p,.tasting-page-head p{margin:0;color:var(--mute);line-height:1.45}
.collection-actions{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;margin:15px 0}
.collection-actions .btn{width:100%;padding:12px 10px}
.collection-search{display:flex;align-items:center;gap:9px;background:linear-gradient(160deg,#fcf8ef,#f6ecdd);border:1px solid #d7c3a3;border-radius:12px;padding:0 13px;margin:13px 0 10px;color:#8a6847}
.collection-search>span{font-size:23px;line-height:1}
.collection-search input{width:100%;min-width:0;border:0;outline:0;background:transparent;padding:13px 0;font-size:16px;color:var(--ink)}
.collection-search input::placeholder{color:#8c7964}
.collection-filters{display:flex;gap:7px;overflow-x:auto;padding:3px 0 10px;scrollbar-width:thin}
.collection-filters .tab{white-space:nowrap;flex:none;background:#f8f0e2}
.collection-filters .tab.on{background:#6f482d;border-color:#6f482d;color:#fbf3e4}
.tasting-list{display:flex;flex-direction:column;gap:9px;margin-top:3px}
.tasting-row-card{position:relative;display:flex;align-items:center;gap:8px;padding:10px 28px 10px 10px;background:linear-gradient(160deg,#fcf8ef,#f5ead8);border:1px solid #d7c3a3;border-radius:14px;box-shadow:0 2px 5px rgba(69,43,22,.05);min-width:0}
.tasting-row-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:0;border:0;background:none;text-align:left;color:var(--ink)}
.tasting-row-photo{width:64px;height:128px;border-radius:9px;overflow:hidden;display:grid;place-items:center;flex:none;background:#e9dcc6;color:#8c6a44;font-size:30px;border:1px solid #d9c6a8}
.tasting-row-photo img{width:100%;height:100%;object-fit:cover}
.tasting-row-info{display:block;min-width:0;flex:1}
.tasting-row-info>b{display:block;font:600 18px/1.2 Fraunces,Georgia,serif;margin:3px 0;overflow-wrap:anywhere}
.tasting-row-info>small{display:block;color:var(--mute);font-size:13px;line-height:1.35}
.tasting-row-kicker{display:block;color:#8a6847;font-size:10px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase}
.tasting-row-rating{display:flex;align-items:center;gap:7px;margin-top:5px}
.tasting-row-rating .s{font-size:14px}
.tasting-row-rating>small{color:var(--mute);font-size:12px}
.tasting-row-favourite{position:absolute;right:10px;top:8px;color:#b45b43;font-size:15px}
.tasting-row-arrow{position:absolute;right:10px;bottom:12px;color:#8a6847;font-size:23px}
.collection-empty,.compare-empty{padding:25px 8px;background:#f8f0e2;border:1px dashed #d7c3a3;border-radius:12px;text-align:center}

/* New/edit tasting cards */
.tasting-view .tasting-page-head{margin-bottom:13px}
.tasting-view .tasting-page-head .dhead{align-items:center;margin:8px 0 0}

const PRODUCTION_STAGES = [
  {id:"grain",title:"Grain",short:"Cereals set the starting point.",body:["Whisky starts with cereal grains. Barley, corn, rye and wheat are the most common. The recipe is called the mash bill, or grist once milled.","Malted barley is used in every malt whisky and in most other styles, because it is the source of the enzymes that turn starch into sugar. Those enzymes are made during malting, the next step. Corn, rye and wheat are normally used unmalted, so they have no working enzymes of their own and rely on malted barley to convert their starch.","Each grain adds something: corn brings sweetness and body, rye peppery spice, wheat softness, and barley cereal and biscuit notes."],terms:"Barley · Corn · Rye · Wheat · Mash bill"},
  {id:"malting",title:"Malting & drying",short:"Barley is soaked, sprouted, then dried. This is where enzymes are made.",body:["Malting is the only step where the enzymes are created. In practice it is done to barley. Other grains can be malted, but that is uncommon. Malting is therefore a preparation step for barley, not a different process for barley versus other grains.","Soaking: the whole grains are soaked in cool water (steeping) for a day or two. This wakes the seed up.","Germination: the soaked barley is spread out and allowed to sprout for several days. During sprouting the grain makes enzymes and loosens the starch inside it. The grain stays whole throughout.","Drying (kilning): warm air dries the sprouting barley and stops it growing. This keeps the starch and the enzymes inside the dry malt for later, and makes the malt stable to store. Unmalted grains are not soaked or sprouted.","Drying method changes flavour. Hot air alone gives clean, unsmoked malt. Burning peat in the kiln adds peat smoke (phenols), strongest in Islay-style malts. Some producers use wood smoke such as beech or oak, usually lighter and sweeter."],terms:"Steeping · Germination · Enzymes · Kilning · Peat · Phenols"},
  {id:"mashing",title:"Milling & mashing",short:"Grain is crushed and meets hot water. Enzymes work here but are not made here.",body:["Milling: all grains are crushed or ground before they meet water, because water can only reach the starch once the grain is broken open. Malted barley is crushed coarsely into grist. Corn, rye and wheat are ground finer, or cooked, so their starch is released.","Mashing: the milled grain is mixed with hot water in a mash tun. Mashing does not create enzymes. It gives the enzymes made in malting the right conditions to work. They are most active in warm water, roughly 60 to 68 degrees C, and very hot water destroys them. They break the starch into sugars, giving a sweet liquid called wort.","Malted barley: it carries its own enzymes, so crushed and mashed in warm water it converts its own starch. It can also convert the starch of other grains mixed in with it.","Unmalted grains: corn, rye and wheat have no active enzymes of their own and their starch is locked inside. They are usually cooked in hot water first to open it up. Cooking can also destroy any enzymes they do have. The cooked grain is then cooled to a suitable temperature and combined with malted barley (or sometimes added enzymes) so the conversion can happen.","Some processes keep the grain solids in the fermenting mixture instead of drawing off clear wort.","This is why bourbon, which is mostly corn, still includes some malted barley. A Scotch malt is 100% malted barley, while bourbon is at least 51% corn."],terms:"Grist · Mash tun · Enzymes · Wort · Cooking · Mash bill"},
  {id:"fermentation",title:"Fermentation",short:"Yeast turns sugars into alcohol and creates flavour compounds.",body:["The wort or mash is cooled and yeast is added. Yeast consumes fermentable sugars, producing alcohol, carbon dioxide and flavour compounds such as esters.","Fermentation takes place in vessels often called washbacks or fermenters. Time, yeast strain, temperature and vessel material all influence the wash and the flavours that may carry into the spirit.","Sour mash is a process used in many American whiskey distilleries: a portion of acidic liquid from a previous distillation is added to the next mash. It helps control acidity and supports consistency; it does not mean the whiskey is sour."],terms:"Yeast · Wash · Washback · Esters · Sour mash"},
  {id:"distillation",title:"Distillation",short:"Alcohol and aroma compounds are concentrated and shaped.",body:["The fermented wash is heated in a still. Alcohol and volatile compounds vaporise, travel through the still and condenser, and are collected as a stronger spirit.","Pot stills are batch-operated and are associated with many malt and pot-still whiskey traditions. Column stills operate continuously and are widely used for grain whiskey and bourbon. Still shape, heating, reflux and the distiller’s cuts influence the spirit’s weight and character.","Scotch malt whisky is commonly distilled twice, while many Irish whiskeys are distilled three times. These are common traditions rather than universal rules. Irish single pot still whiskey combines malted and unmalted barley and is distilled in pot stills."],terms:"Pot still · Column still · Reflux · Spirit cut · Double / triple distillation"},
  {id:"maturation",title:"Maturation & casks",short:"Time in wood transforms the new spirit.",body:["Newly distilled spirit is filled into casks and left to mature. Wood contributes flavour and colour, while oxygen, evaporation and the local warehouse climate affect how the spirit develops.","Used bourbon barrels can bring vanilla, coconut and gentle oak. Sherry-seasoned casks may contribute dried fruit, nuts and spice. New charred oak, required for bourbon, can add stronger vanilla, caramel, toast and tannin notes.","Cask size, previous contents, the wood itself, warehouse position and climate all matter. A longer age does not automatically mean a better whisky; it means the whisky has spent longer maturing in wood.","A cask finish is a further period in a different cask after the main maturation. Common examples include port, wine, rum or sherry casks."],terms:"New make spirit · Bourbon cask · Sherry cask · Cask strength · Angel’s share · Finish"},
  {id:"blending",title:"Blending",short:"Different whiskies can be combined to build balance and character.",body:["Blending may combine different casks, ages, grain types or distilleries. The blender aims for balance, complexity or a recognisable house style.","A blended whisky can combine malt whisky and grain whisky. A blended malt combines malt whiskies from more than one distillery, without grain whisky. A single malt comes from one distillery, but can still be a combination of many casks and ages.","Blending is not a sign of lower quality. It is a skilled part of whisky-making and is used for many respected and long-established whiskies."],terms:"Blended whisky · Blended malt · Vatting · House style"},
  {id:"bottling",title:"Finishing & bottling",short:"The whisky is prepared for the bottle and the label.",body:["Before bottling, whisky may be reduced to the desired strength with water. Some is bottled at cask strength with little or no dilution.","Producers may choose chill filtration to reduce haze when cold or diluted. Others leave the whisky non-chill-filtered. Some whiskies use plain caramel colouring (E150a) for shade consistency; these choices are usually declared by the producer or on the label.","The label can tell you useful things: age statement, alcohol strength (ABV), cask strength, single cask, non-chill-filtered and the whisky’s legal category. An age statement refers to the youngest whisky in the bottle."],terms:"ABV · Cask strength · Chill filtration · Natural colour · Age statement"}
];

const WHISKY_STYLES = [
  {id:"single-malt",title:"Single malt",where:"Scotland, Ireland, Japan and other whisky-producing countries",definition:"A whisky made at one distillery from malted barley. ‘Single’ refers to one distillery, not one barrel or one year. The exact legal definition depends on the country.",character:"The style can range from light, floral and fruity to rich, oily or heavily peated. Distillery character and cask selection matter more than the label alone.",examples:"Glenfiddich 12 · The Glenlivet 12 · Yamazaki 12 · Hakushu 12",note:"For Scotch single malt, the whisky must be made from water and malted barley at one distillery and distilled in pot stills."},
  {id:"single-grain",title:"Single grain",where:"Most familiar in Scotland and Ireland; also produced elsewhere",definition:"Whisky from one distillery that is not classified as single malt. It may use grains such as wheat, corn or rye, usually alongside some malted barley, and is often made in column stills.",character:"Often lighter and softer than many pot-still malt whiskies, though grain whisky can also be rich and distinctive, especially after long maturation.",examples:"Nikka Coffey Grain · Teeling Single Grain · well-aged single-grain Scotch bottlings",note:"‘Grain’ does not mean that the whisky contains no barley. It distinguishes the category from single malt."},
  {id:"blended-malt",title:"Blended malt",where:"Commonly associated with Scotch whisky",definition:"A blend of single malt whiskies from two or more distilleries. It contains malt whisky only, with no grain whisky in the blend.",character:"The blender can combine different distillery styles to create a balanced or more complex malt-led whisky.",examples:"Johnnie Walker Green Label 15 · Monkey Shoulder",note:"Older labels may use the term ‘vatted malt’. The current Scotch category term is blended malt Scotch whisky."},
  {id:"blended",title:"Blended whisky",where:"Scotland, Ireland, Canada, Japan and many other countries",definition:"A combination of whiskies, often malt and grain whisky. The exact recipe and legal meaning vary by country.",character:"Blends are designed for balance and consistency, but can also be complex and premium. They are not inherently lower quality than single malts.",examples:"Johnnie Walker Black Label · Chivas Regal 12 · Jameson Original · Hibiki Japanese Harmony",note:"A blended Scotch combines one or more single malt Scotch whiskies with one or more single grain Scotch whiskies."},
  {id:"single-pot-still",title:"Single pot still Irish whiskey",where:"Ireland",definition:"Irish whiskey made at one distillery in pot stills from a mash containing both malted and unmalted barley. The rules require at least 30% of each, with limited allowance for other cereals.",character:"Often full-bodied and textured, with cereal, orchard fruit, spice and sometimes creamy or oily impressions. Triple distillation is common but not essential to the style definition.",examples:"Redbreast 12 · Green Spot · Powers John’s Lane Release",note:"This is a distinct Irish category, not simply another name for single malt."},
  {id:"bourbon",title:"Bourbon",where:"United States; strongly associated with Kentucky but made nationwide",definition:"American whiskey made from a mash containing at least 51% corn and matured in new, charred oak containers. It has no general minimum age requirement; ‘straight bourbon’ must be aged at least two years.",character:"Often brings corn sweetness, vanilla, caramel, toasted oak and baking spice. Rye, wheat and the cask-entry strength also influence the final profile.",examples:"Buffalo Trace · Maker’s Mark · Woodford Reserve · Wild Turkey 101",note:"Bourbon is a legal type of American whiskey, not a geographical synonym for Kentucky whiskey."},
  {id:"rye",title:"Rye whiskey",where:"United States and Canada",definition:"In the United States, rye whiskey must use at least 51% rye in its mash and mature in new, charred oak containers. Canadian whisky may be called ‘rye’ without meeting that 51% requirement.",character:"American rye often shows pepper, herbs, dry spice and bold grain character. Canadian rye can range from rye-forward to a blend where rye is one flavour component among several.",examples:"Rittenhouse Rye · Bulleit Rye · Alberta Premium 100% Rye · Lot No. 40",note:"The meaning of ‘rye’ differs between the US and Canada. Always consider the country and the label."},
  {id:"tennessee",title:"Tennessee whiskey",where:"Tennessee, United States",definition:"A Tennessee-made whiskey using at least 51% corn and matured in new charred oak, with state requirements including charcoal mellowing before ageing (subject to defined exceptions).",character:"Often similar in broad profile to bourbon, with corn sweetness, vanilla and oak. Charcoal mellowing is intended to soften the spirit before cask maturation.",examples:"Jack Daniel’s Old No. 7 · Gentleman Jack · George Dickel No. 12",note:"Tennessee whiskey has a distinct geographical and production identity; it is not simply a synonym for bourbon."},
  {id:"canadian",title:"Canadian whisky",where:"Canada",definition:"Whisky made in Canada and generally aged for at least three years in small wood. Canadian rules allow different grain recipes and blending approaches.",character:"Often associated with smooth, approachable blends, but the category includes full-flavoured rye, single-grain and single-malt examples too.",examples:"Crown Royal Deluxe · Canadian Club 12 · Alberta Premium · Lot No. 40",note:"Canadian whisky does not require a 51% rye mash bill. The traditional use of ‘rye’ in Canada is broader than the American legal category."},
  {id:"japanese",title:"Japanese whisky",where:"Japan",definition:"A national style with an industry labelling standard. Under the Japan Spirits & Liqueurs Makers Association standard, qualifying whisky must be mashed, fermented, distilled, matured in wooden casks in Japan for at least three years, and bottled in Japan at 40% ABV or higher.",character:"There is no single Japanese flavour profile. Producers create light, delicate, fruity, smoky and richly cask-influenced whiskies, often using blending to build balance.",examples:"Yamazaki 12 · Hakushu 12 · Yoichi Single Malt · Hibiki Japanese Harmony",note:"The Japanese whisky labelling standard is an industry standard rather than a government geographical-indication law. Check the label and producer details."},
  {id:"american-single-malt",title:"American single malt",where:"United States",definition:"A federally recognised US whisky category, effective January 19, 2025. It must be made in the US at one distillery from a fermented mash of 100% malted barley and aged in oak barrels of up to 700 litres.",character:"The category is young as a formal designation but covers a wide range: fruit-led, malty, coastal, smoky or strongly cask-driven styles.",examples:"Westland American Single Malt · Westward American Single Malt · Stranahan’s Original",note:"The new US standard permits used, uncharred new or charred new oak barrels; it is not restricted to new charred oak like bourbon."}
];

const WATER_TOPICS = [
  {id:"abv",title:"Do a few drops change the strength?",short:"The numbers behind the advice.",body:["Not noticeably. Figures below assume a 46% whisky and a 3 oz (about 90 ml) pour. A drop is roughly 0.05 ml, so four drops lower the strength by about 0.1 point, which no one can taste.","One teaspoon (about 5 ml) brings it to roughly 43.6%. Two teaspoons gives about 41.4%. So when guides say a few drops, they usually mean a teaspoon or more.","For comparison, many bottles are sold at 40% to 43%, so a teaspoon moves a cask-strength whisky into that range."]},
  {id:"why",title:"Why might it change the aroma?",short:"What water is thought to do.",body:["Lower strength means less alcohol burn and numbing, so subtle flavours are easier to notice.","A commonly cited idea is that some aroma compounds move towards the surface of the glass as the alcohol level drops. Researchers still debate how large the effect is.","Results differ by whisky. Cask-strength and heavily peated whiskies often change most, while a 40% whisky can turn flat."]},
  {id:"lasting",title:"Does the effect last?",short:"Why people disagree.",body:["Dilution is immediate and cannot be undone. Some people feel the change fades as the glass sits, others notice it through the whole pour.","Part of the disagreement is that tasters add different amounts, and expectations influence what we notice. Treat it as a personal preference, not a rule."]},
  {id:"try",title:"How to try it",short:"A simple method.",body:["Taste the whisky neat first and note it.","Add about a quarter teaspoon, swirl gently, and smell and taste again. Add more only if you want to keep exploring.","Record the amount and the change in the Water step of a tasting, so you can compare bottles later."]}
];
function waterPage() {
  return `${learnTop("Adding Water","What changes when water is added, and how much it takes.","WATER")}<div class="stage-list">${WATER_TOPICS.map(s=>{const active=openLearnItems.has("water:"+s.id);return `<article class="stage-card ${active?"expanded":""}"><button class="stage-toggle" data-expand="water:${s.id}" aria-expanded="${active}"><span class="stage-title-wrap"><b>${s.title}</b><small>${s.short}</small></span><span class="stage-plus">${active?"−":"+"}</span></button>${active?`<div class="stage-detail">${s.body.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`:""}</article>`}).join("")}</div><p class="learn-footnote">Strength figures are approximate and assume plain water added to 46% whisky.</p>`;
}

function waterAmountParts(n) {
  const raw = String(n.waterAmt ?? "").trim();
  const m = raw.match(/^(\d+(?:\.\d+)?)\s*(drops?|tsp|teaspoons?)?$/i);
  if (!m) return { amount: "", unit: String(n.waterUnit || "tsp").toLowerCase() === "drops" ? "drops" : "tsp", legacy: raw };
  const parsedUnit = m[2] ? (/^t/i.test(m[2]) ? "tsp" : "drops") : (String(n.waterUnit || "tsp").toLowerCase() === "drops" ? "drops" : "tsp");
  return { amount: m[1], unit: parsedUnit, legacy: "" };
}
function waterAmountLabel(n) {
  const p = waterAmountParts(n);
  if (p.legacy) return p.legacy;
  if (!p.amount) return "";
  return `${p.amount} ${p.unit === "tsp" ? "TSP" : "drops"}`;
}

function part(i, ed) {
  const n = draft;
  const fld = (k, l, t = "text", x = "") => (!ed && !getP(n, k)) ? "" : `<label class="fld">${l}<input data-f="${k}" type="${t}" ${x} value="${esc(getP(n, k))}"></label>`;
  const tx = (k, l) => (!ed && !getP(n, k)) ? "" : `<label class="fld">${l}<textarea data-f="${k}">${esc(getP(n, k))}</textarea></label>`;
  const renderGroups = s => s.g.map(([g, one, items]) => {
    const sl = n.tags?.[s.k + "|" + g] || [];
    const shown = ed ? items : items.filter(x => sl.includes(x));
    return shown.length ? `<fieldset><legend>${g}</legend><div class="chips">${shown.map(x => `<label class="chip"><input type="checkbox" ${one ? 'data-one="1"' : ""} name="${s.k}|${g}" data-g="${s.k}|${g}" value="${esc(x)}" ${sl.includes(x) ? "checked" : ""}><span>${esc(x)}</span></label>`).join("")}</div></fieldset>` : "";
  }).join("");

  if (i === 0) {
    const src = pending || n.thumb;
    const ph = src ? `<img id="pimg" src="${src}" alt="Full bottle photograph">` : (ed ? "Add full bottle photo<br>(tap to choose and crop)" : "No photo");
    const sel = (k, l, opts, nb) => (!ed && !n[k]) ? "" : `<label class="fld">${l}<select data-f="${k}">${nb ? `<option value="">Not set</option>` : ""}${opts.map(o => `<option value="${esc(o)}" ${o === n[k] ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`;
    return `<section class="entry-panel bottle-panel">${entryPanelHead("Bottle", "01 · IDENTIFY", "Enter the bottle details manually. Add a full bottle photograph and crop it to frame the bottle.")}
      <div class="top bottle-entry-grid"><label class="photo" id="drop">${ph}<input type="file" id="file" accept="image/*" hidden ${ed ? "" : "disabled"}></label><div class="grid bottle-fields">
      ${fld("name", "Bottle name *")}${fld("distillery", "Distillery")}${sel("category", "Category", CATS)}${sel("type", "Style", TYPES, 1)}
      ${fld("region", "Region", "text", 'list="rg"')}<datalist id="rg">${(REGIONS[n.category] || []).map(r => `<option value="${esc(r)}">`).join("")}</datalist>
      ${fld("age", "Age (years)", "number", `inputmode="numeric" ${n.noAge ? "disabled" : ""}`)}${ed || n.noAge ? `<label class="chip no-age-chip"><input type="checkbox" data-f="noAge" ${n.noAge ? "checked" : ""}><span>No age statement</span></label>` : ""}
      ${fld("abv", "ABV %", "number", 'inputmode="decimal" step="0.1"')}${fld("price", "Price")}</div></div></section>`;
  }

  if (i === STEPS.length - 1) {
    const v = n.rating || 0;
    const r = ed ? `<div class="rate" id="rate">${[1, 2, 3, 4, 5].map(k => `<span class="s ${v >= k ? "f" : v >= k - .5 ? "h" : ""}"><b data-r="${k - .5}"></b><b data-r="${k}"></b>★</span>`).join("")}</div><p class="rating-caption" id="rv">${v ? v + " / 5" : "Tap a star. The left half gives a half star."}</p>`

    return `<section class="entry-panel rating-panel">${entryPanelHead("Overall impression", "FINAL STEP", "Give the whisky an overall rating and add any final thoughts.")}${r}${comments}</section>`;
  }

  if (i === STEPS.length - 2) {
    const p = waterAmountParts(n);
    const groups = renderGroups(WATER_SECTION);
    const amount = ed ? `<div class="water-measure"><label class="fld">Amount added<input data-f="waterAmt" type="number" min="0" step="any" inputmode="decimal" placeholder="Enter a number" value="${esc(p.amount)}"></label><label class="fld">Unit<select data-f="waterUnit"><option value="tsp" ${p.unit === "tsp" ? "selected" : ""}>TSP</option><option value="drops" ${p.unit === "drops" ? "selected" : ""}>Drops</option></select></label></div><div class="water-presets-wrap" id="waterPresetsWrap" ${p.unit === "tsp" ? "" : "hidden"}><span class="water-presets-label">QUICK TSP AMOUNTS</span><div class="water-presets"><button class="water-preset ${p.amount === "0.25" ? "on" : ""}" type="button" data-water-preset="0.25" aria-label="One quarter teaspoon" aria-pressed="${p.amount === "0.25"}">¼</button><button class="water-preset ${p.amount === "0.5" ? "on" : ""}" type="button" data-water-preset="0.5" aria-label="One half teaspoon" aria-pressed="${p.amount === "0.5"}">½</button><button class="water-preset ${p.amount === "0.75" ? "on" : ""}" type="button" data-water-preset="0.75" aria-label="Three quarters teaspoon" aria-pressed="${p.amount === "0.75"}">¾</button><button class="water-preset ${p.amount === "1" ? "on" : ""}" type="button" data-water-preset="1" aria-label="One teaspoon" aria-pressed="${p.amount === "1"}">1</button></div></div>`
      : (waterAmountLabel(n) ? `<p class="water-saved-amount">${esc(waterAmountLabel(n))} added</p>` : "");
    const effects = groups || (ed ? `<p class="entry-hint">You can leave this entire step blank if you tasted the whisky neat.</p>` : "");
    const waterNotes = tx("notes.water", "Notes");
    if (!ed && !amount && !groups && !waterNotes) return "";
    return `<section class="entry-panel water-entry-panel">${entryPanelHead("Adding Water", "OPTIONAL STEP", "Record what changes after adding water. Leave this section blank if you tasted the whisky neat.")}${amount}${effects}${waterNotes}</section>`;
  }

  const s = SECTIONS[i - 1];
  const groups = renderGroups(s);
  const flavourSection = ["nose", "taste", "finish"].includes(s.k);
  const groupContent = flavourSection && ed
    ? `<div class="guided-entry-card"><div><span class="eyebrow">GUIDED FLAVOUR LIBRARY</span><b>Explore what you notice</b><p>Browse the same flavour reference found in Learn. Choose a descriptor to add it to your notes.</p></div><button class="btn" type="button" data-a="guideOpen" data-section="${s.k}">Explore Flavours <span aria-hidden="true">›</span></button></div><details class="quick-tags"><summary>Quick tags <span>(optional)</span></summary>${groups}</details>`

}

function flavourProfile(n) {
  const list = a => a.length > 1 ? a.slice(0, -1).join(", ") + " and " + a[a.length - 1] : a[0] || "";
  const pick = k => { const g = n.tags || {}; const sp = Object.entries(g).filter(([x]) => x.startsWith(k + "|") && x.endsWith(" notes")).flatMap(([, v]) => v); const r = [...new Set(sp.length ? sp : (g[k + "|Character"] || []))].slice(0, 3).map(x => x.toLowerCase()); r.cat = !sp.length; return r; };
  const col = ((n.tags || {})["appearance|Color"] || [])[0], len = ((n.tags || {})["finish|Length"] || [])[0];
  const nose = pick("nose"), taste = pick("taste"), fin = pick("finish"), parts = [];
  if (nose.length) parts.push(list(nose) + (nose.cat ? " notes" : "") + " on the nose");
  if (taste.length) parts.push(list(taste) + (taste.cat ? " notes" : "") + " on the palate");
  if (len || fin.length) parts.push("a " + (len ? len.toLowerCase() + " " : "") + "finish" + (fin.length ? " of " + list(fin) + (fin.cat ? " notes" : "") : ""));
  if (!col && !parts.length) return "";
  const c = col ? col.toLowerCase() : "";
  return (c ? (/^[aeiou]/.test(c) ? "An " : "A ") + c + " whisky" : "A whisky") + (parts.length ? " with " + list(parts) : "") + ".";
}

function render(keep) {

  page.classList.toggle("learning-view", view === "learn");
  page.classList.toggle("collection-view", view === "coll");
  page.classList.toggle("tasting-view", view === "note" || view === "wnote");
  page.classList.toggle("compare-view", view === "cmp");
  document.querySelectorAll(".bar button").forEach(b => b.classList.toggle("on", b.dataset.v === (view === "note" ? "coll" : view === "wnote" ? "wish" : view)));
  if ((view === "note" && editing && step === 0) || (view === "wnote" && editing)) bindPhoto();
  if (guideOn) paintGuide(); else if ($("#guideov")) $("#guideov").hidden = true;
  window.scrollTo(0, keep ? y : 0);

function keepActiveStepVisible() {
  const nav = document.querySelector(".tasting-step-nav");
  const active = nav?.querySelector(".step-tab.on");
  if (!nav || !active) return;
  const navRect = nav.getBoundingClientRect();
  const activeRect = active.getBoundingClientRect();
  const left = activeRect.left - navRect.left + nav.scrollLeft;
  const right = left + activeRect.width;
  const visibleLeft = nav.scrollLeft;
  const visibleRight = visibleLeft + nav.clientWidth;
  if (left < visibleLeft + 4) nav.scrollTo({ left: Math.max(0, left - 4), behavior: "smooth" });
  else if (right > visibleRight - 4) nav.scrollTo({ left: right - nav.clientWidth + 4, behavior: "smooth" });
}

function bindPhoto() {
  const d = $("#drop");

async function setPhoto(file) {

function openPhotoCrop(bitmap) {
  closePhotoCrop();
  photoCrop = { bitmap, zoom: 1, x: 0, y: 0, baseScale: 1, stageW: 0, stageH: 0, drag: null };
  const modal = document.createElement("div");
  modal.id = "photoCropModal";
  modal.className = "photo-crop-modal";
  modal.innerHTML = `<section class="photo-crop-dialog" role="dialog" aria-modal="true" aria-labelledby="photoCropTitle">
    <div class="photo-crop-head"><h3 id="photoCropTitle">Crop bottle photo</h3><button class="btn ghost" type="button" data-crop-action="cancel">Cancel</button></div>
    <p class="photo-crop-help">Drag the photo to position the bottle inside the frame. Use the slider to zoom in or out.</p>
    <div class="photo-crop-stage" id="photoCropStage" aria-label="Photo crop area. Drag to reposition."><canvas id="photoCropCanvas"></canvas><div class="photo-crop-frame"></div></div>
    <div class="photo-crop-controls"><label class="photo-crop-zoom">Zoom <input id="photoCropZoom" type="range" min="1" max="3.5" step="0.01" value="1" aria-label="Zoom photo"></label><button class="btn ghost" type="button" data-crop-action="reset">Reset</button></div>
    <div class="photo-crop-actions"><button class="btn ghost" type="button" data-crop-action="cancel">Cancel</button><button class="btn" type="button" data-crop-action="apply">Use cropped photo</button></div>
    <p class="photo-crop-note">Tall bottle crop · 1.5:3 display frame</p>
  </section>`;
  $("#root").appendChild(modal);

    if (!photoCrop || !document.getElementById("photoCropStage")) return;
    const stage = $("#photoCropStage"), canvas = $("#photoCropCanvas"), b = photoCrop.bitmap;
    const rect = stage.getBoundingClientRect();
    photoCrop.stageW = rect.width; photoCrop.stageH = rect.height;
    photoCrop.baseScale = Math.max(rect.width / b.width, rect.height / b.height);
    photoCrop.zoom = 1;
    photoCrop.x = (rect.width - b.width * photoCrop.baseScale) / 2;
    photoCrop.y = (rect.height - b.height * photoCrop.baseScale) / 2;
    const previewScale = Math.min(1, 1800 / Math.max(b.width, b.height));
    canvas.width = Math.max(1, Math.round(b.width * previewScale));
    canvas.height = Math.max(1, Math.round(b.height * previewScale));
    canvas.getContext("2d", { alpha: false }).drawImage(b, 0, 0, canvas.width, canvas.height);
    paintPhotoCrop();
    bindPhotoCropDrag(stage);
  });
}

function paintPhotoCrop() {
  if (!photoCrop) return;
  const canvas = $("#photoCropCanvas");
  if (!canvas) return;
  const scale = photoCrop.baseScale * photoCrop.zoom;
  const w = photoCrop.bitmap.width * scale, h = photoCrop.bitmap.height * scale;
  photoCrop.x = Math.min(0, Math.max(photoCrop.stageW - w, photoCrop.x));
  photoCrop.y = Math.min(0, Math.max(photoCrop.stageH - h, photoCrop.y));
  canvas.style.width = `${w}px`; canvas.style.height = `${h}px`;
  canvas.style.left = `${photoCrop.x}px`; canvas.style.top = `${photoCrop.y}px`;
}

function bindPhotoCropDrag(stage) {
  stage.addEventListener("pointerdown", e => {
    if (!photoCrop) return;
    e.preventDefault();
    stage.setPointerCapture?.(e.pointerId);
    photoCrop.drag = { id: e.pointerId, startX: e.clientX, startY: e.clientY, imageX: photoCrop.x, imageY: photoCrop.y };
  });
  stage.addEventListener("pointermove", e => {
    if (!photoCrop?.drag || photoCrop.drag.id !== e.pointerId) return;
    e.preventDefault();
    photoCrop.x = photoCrop.drag.imageX + e.clientX - photoCrop.drag.startX;
    photoCrop.y = photoCrop.drag.imageY + e.clientY - photoCrop.drag.startY;
    paintPhotoCrop();
  });
  const finish = e => { if (photoCrop?.drag?.id === e.pointerId) photoCrop.drag = null; };
  stage.addEventListener("pointerup", finish);
  stage.addEventListener("pointercancel", finish);
}

function setPhotoCropZoom(value) {
  if (!photoCrop) return;
  const next = Math.min(3.5, Math.max(1, Number(value) || 1));
  const oldScale = photoCrop.baseScale * photoCrop.zoom;
  const centerX = (photoCrop.stageW / 2 - photoCrop.x) / oldScale;
  const centerY = (photoCrop.stageH / 2 - photoCrop.y) / oldScale;
  photoCrop.zoom = next;
  const newScale = photoCrop.baseScale * next;
  photoCrop.x = photoCrop.stageW / 2 - centerX * newScale;
  photoCrop.y = photoCrop.stageH / 2 - centerY * newScale;
  paintPhotoCrop();
}

function resetPhotoCrop() {
  if (!photoCrop) return;
  photoCrop.zoom = 1;
  photoCrop.x = (photoCrop.stageW - photoCrop.bitmap.width * photoCrop.baseScale) / 2;
  photoCrop.y = (photoCrop.stageH - photoCrop.bitmap.height * photoCrop.baseScale) / 2;
  const slider = $("#photoCropZoom"); if (slider) slider.value = "1";
  paintPhotoCrop();
}

function closePhotoCrop() {
  if (photoCrop?.bitmap) photoCrop.bitmap.close?.();
  photoCrop = null;
  $("#photoCropModal")?.remove();
}

function applyPhotoCrop() {
  if (!photoCrop || !draft) return;
  const { bitmap, baseScale, zoom, x, y, stageW, stageH } = photoCrop;
  const scale = baseScale * zoom;
  const sx = Math.max(0, Math.min(bitmap.width, -x / scale));
  const sy = Math.max(0, Math.min(bitmap.height, -y / scale));
  const sw = Math.min(bitmap.width - sx, stageW / scale);
  const sh = Math.min(bitmap.height - sy, stageH / scale);
  if (!(sw > 0 && sh > 0)) { toast("Could not crop that photo. Please try again."); return; }
  const outScale = Math.min(1, 1200 / Math.max(sw, sh));
  const out = document.createElement("canvas");
  out.width = Math.max(1, Math.round(sw * outScale));
  out.height = Math.max(1, Math.round(sh * outScale));
  out.getContext("2d", { alpha: false }).drawImage(bitmap, sx, sy, sw, sh, 0, 0, out.width, out.height);
  pending = out.toDataURL("image/jpeg", 0.86);
  const thumb = document.createElement("canvas");
  thumb.width = 100; thumb.height = 200;
  thumb.getContext("2d", { alpha: false }).drawImage(out, 0, 0, thumb.width, thumb.height);
  draft.thumb = thumb.toDataURL("image/jpeg", 0.72);
  const preview = $("#drop");
  if (preview) {
    preview.innerHTML = `<img id="pimg" src="${pending}" alt="Cropped full bottle photograph"><input type="file" id="file" accept="image/*" hidden>`;
    const input = $("#file"); if (input) input.onchange = e => e.target.files[0] && setPhoto(e.target.files[0]);
  }
  closePhotoCrop();
  toast("Bottle photo cropped");
}

function noteDescriptorParts(value) {
  return String(value || "").split(/[,;\n]+/).map(x => x.trim()).filter(Boolean);
}
function descriptorIsInNotes(sectionKey, descriptor) {

function addFlavourDescriptor(sectionKey, category, descriptor) {
  if (!draft) return false;
  draft.notes ||= {};

  const broadKey = `${sectionKey}|Character`;
  const specificKey = `${sectionKey}|${category} notes`;
  const pieces = noteDescriptorParts(draft.notes[sectionKey]);
  const alreadyAdded = pieces.some(x => x.toLocaleLowerCase() === descriptor.toLocaleLowerCase());
  if (alreadyAdded) {
    // Remove only the exact descriptor token, preserving the rest of the user's notes.
    draft.notes[sectionKey] = pieces.filter(x => x.toLocaleLowerCase() !== descriptor.toLocaleLowerCase()).join(", ");
    draft.tags[specificKey] = (draft.tags[specificKey] || []).filter(x => x.toLocaleLowerCase() !== descriptor.toLocaleLowerCase());
    if (!draft.tags[specificKey].length) delete draft.tags[specificKey];
    const categoryStillUsed = (draft.tags[specificKey] || []).length > 0;
    if (!categoryStillUsed) draft.tags[broadKey] = (draft.tags[broadKey] || []).filter(x => x !== category);
    if (!draft.tags[broadKey]?.length) delete draft.tags[broadKey];

    if (!draft.tags[specificKey].includes(descriptor)) draft.tags[specificKey].push(descriptor);

}

    draft.updated = Date.now();
    store.save(draft, pending);
    if (wishRemoveOnSave) { store.wdel(wishRemoveOnSave); wishes = wishes.filter(x => x.id !== wishRemoveOnSave); wishRemoveOnSave = null; }
    const copy = structuredClone(draft), i = notes.findIndex(n => n.id === draft.id);
    if (i < 0) notes.push(copy); else notes[i] = copy;
    toast("Saved"); guideOn = false; openNote(structuredClone(copy), false);
  }
  if (a === "del" && confirm("Delete this note? This cannot be undone.")) {
    store.del(draft.id); notes = notes.filter(n => n.id !== draft.id);
    draft = null; editing = false; view = "coll"; render(); toast("Deleted");
  }
}
function onInput(e) {
  const t = e.target;
  if (t.id === "photoCropZoom") { setPhotoCropZoom(t.value); return; }
  if (t.id === "q") { q = t.value; renderList(); return; }
  if (t.dataset.cmp) { t.dataset.cmp === "A" ? cA = t.value : cB = t.value; const y = scrollY; render(); scrollTo(0, y); return; }
  if (!editing) return;
  if (t.dataset.g) {
    if (t.dataset.one && t.checked) document.querySelectorAll(`[data-g="${t.dataset.g}"]`).forEach(i => { if (i !== t) i.checked = false; });
    draft.tags[t.dataset.g] = [...document.querySelectorAll(`[data-g="${t.dataset.g}"]:checked`)].map(i => i.value);
    return;
  }
  const f = t.dataset.f; if (!f) return;
  if (["name", "distillery", "category", "type", "region", "age", "abv", "price"].includes(f)) manualBottleFields.add(f);
  setP(draft, f, t.type === "checkbox" ? t.checked : t.value);
  if (f === "noAge") { const a = document.querySelector('[data-f="age"]'); a.disabled = t.checked; if (t.checked) { a.value = ""; draft.age = ""; } }
  if (f === "category") { const rg = $("#rg"); if (rg) rg.innerHTML = (REGIONS[t.value] || []).map(r => `<option value="${esc(r)}">`).join(""); }
  if (f === "waterAmt" || f === "waterUnit") {
    const p = waterAmountParts(draft), presets = $("#waterPresetsWrap");
    if (presets) presets.hidden = p.unit !== "tsp";
    document.querySelectorAll("[data-water-preset]").forEach(button => {
      const active = p.unit === "tsp" && Number(button.dataset.waterPreset) === Number(p.amount) && p.amount !== "";
      button.classList.toggle("on", active);
      button.setAttribute("aria-pressed", String(active));
    });
  }
}

$("#root").addEventListener("click", onClick);
$("#root").addEventListener("input", onInput);
$("#root").addEventListener("change", onInput);
// Native buttons and controls provide keyboard interaction for the guided flavour library.

function start() {
  view = "coll"; draft = null; editing = false;
  $("#root").innerHTML = `<main class="page" id="page"></main><nav class="bar" aria-label="Main navigation">${[["coll", "Tastings"], ["wish", "Wishlist"], ["learn", "Learn"], ["cmp", "Compare"], ["links", "Links"]].map(([v, l]) => `<button data-v="${v}">${l}</button>`).join("")}</nav><div class="ov" id="guideov" hidden></div>`;
  render();
  unsubW?.(); unsubW = store.wlisten(list => { wishes = list; if (view === "wish") render(); });
  unsub?.();
  unsub = store.listen(list => { notes = list; if (view === "coll") renderList(); else if (view === "cmp") render(); });
}

/* ---------- Boot ---------- */
if (LOCAL) start();
else {
  const authErr = c => ({
    "auth/invalid-credential": "Wrong email or password.",
    "auth/invalid-email": "That email address is not valid.",
    "auth/weak-password": "Use a password of at least 6 characters.",
    "auth/operation-not-allowed": "Email and password sign-in is turned off in Firebase.",
    "auth/too-many-requests": "Too many attempts. Wait a few minutes and try again."
  }[c] || "Sign-in failed. Check your connection and try again.");
  fb.onAuthStateChanged(auth, u => {
    if (u) { start(); return; }
    unsub?.(); unsub = null; unsubW?.(); unsubW = null; notes = []; wishes = []; draft = null;
    $("#root").innerHTML = `<form class="login" id="lf"><h1>Whisky Notes</h1><small class="ver">v${VERSION}</small>
      <label class="fld">Email<input id="em" type="email" autocomplete="username"></label>
      <label class="fld">Password<input id="pw" type="password" autocomplete="current-password"></label>
      <p class="err" id="err" role="alert"></p>
      <div class="acts"><button class="btn" type="submit">Sign in</button></div></form>`;
    const go = async make => {
      const em = $("#em").value.trim(), pw = $("#pw").value;
      if (!em || !pw) { $("#err").textContent = "Enter your email and password."; return; }
      try { await make(auth, em, pw); } catch (e) { $("#err").textContent = authErr(e.code); }
    };
    $("#lf").onsubmit = e => { e.preventDefault(); go(fb.signInWithEmailAndPassword); };
  });
}
</script>
